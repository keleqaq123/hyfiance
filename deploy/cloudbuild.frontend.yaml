steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/frontend.Dockerfile
      - --build-arg
      - VITE_API_BASE=${_VITE_API_BASE}
      - --build-arg
      - VITE_CHAIN_ID=${_VITE_CHAIN_ID}
      - --build-arg
      - VITE_NETWORK_URL=${_VITE_NETWORK_URL}
      - --build-arg
      - VITE_GIWA_RPC=${_VITE_GIWA_RPC}
      - --build-arg
      - VITE_GIWA_EXPLORER=${_VITE_GIWA_EXPLORER}
      - --build-arg
      - VITE_GIWA_CHAIN_ID=${_VITE_GIWA_CHAIN_ID}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
