services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: custos-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/rwa_exchange.db
      BETA_DATABASE_PATH: /data/kelq_beta.db
      REALITY_DATA_DIR: /data/reality
      REALITY_PUBLIC_ORIGIN: ${REALITY_PUBLIC_ORIGIN:-https://www.custosfinance.xyz}
      REALITY_ADMIN_WALLETS: ${REALITY_ADMIN_WALLETS:-}
      REALITY_LAUNCHPAD_ADDRESS: ${REALITY_LAUNCHPAD_ADDRESS:-}
      REALITY_PLATFORM_TOKEN: ${REALITY_PLATFORM_TOKEN:-}
      REALITY_SWAP_ROUTER: ${REALITY_SWAP_ROUTER:-}
      REALITY_SWAP_FACTORY: ${REALITY_SWAP_FACTORY:-}
      REALITY_CFI_STAKING: ${REALITY_CFI_STAKING:-}
      REALITY_CFI_START_BLOCK: ${REALITY_CFI_START_BLOCK:-0}
      REALITY_CFI_PRICE_SOURCE: ${REALITY_CFI_PRICE_SOURCE:-binance}
      CFI_QUOTE_SIGNER_KEY: ${CFI_QUOTE_SIGNER_KEY:-}
      FAUCET_ENABLED: ${FAUCET_ENABLED:-false}
      FAUCET_CAPTCHA_REQUIRED: ${FAUCET_CAPTCHA_REQUIRED:-true}
      FAUCET_DAILY_REQUEST_LIMIT: ${FAUCET_DAILY_REQUEST_LIMIT:-}
      FAUCET_CONTRACT_ADDRESS: ${FAUCET_CONTRACT_ADDRESS:-}
      FAUCET_OPERATOR_PRIVATE_KEY: ${FAUCET_OPERATOR_PRIVATE_KEY:-}
      FAUCET_TURNSTILE_SECRET: ${FAUCET_TURNSTILE_SECRET:-}
      FAUCET_TURNSTILE_SITE_KEY: ${FAUCET_TURNSTILE_SITE_KEY:-}
      FAUCET_ALLOWED_ORIGINS: ${FAUCET_ALLOWED_ORIGINS:-https://custosfinance.xyz,https://www.custosfinance.xyz}
      FAUCET_TRUSTED_PROXY_CIDRS: ${FAUCET_TRUSTED_PROXY_CIDRS:-}
      FAUCET_DATABASE_PATH: /data/faucet.db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      GIWA_RPC_URL: ${GIWA_RPC_URL:-https://sepolia-rpc.giwa.io}
      GIWA_FLASHBLOCKS_RPC_URL: ${GIWA_FLASHBLOCKS_RPC_URL:-https://sepolia-rpc-flashblocks.giwa.io}
      GIWA_EXPLORER_URL: ${GIWA_EXPLORER_URL:-https://sepolia-explorer.giwa.io}
      PYTH_HERMES_URL: ${PYTH_HERMES_URL:-https://hermes.pyth.network}
      PYTH_API_KEY: ${PYTH_API_KEY:-}
      PYTH_PRO_API_KEY: ${PYTH_PRO_API_KEY:-}
      PYTH_STREAM_CHANNEL: ${PYTH_STREAM_CHANNEL:-fixed_rate@200ms}
      PYTH_STREAM_ENDPOINTS: ${PYTH_STREAM_ENDPOINTS:-}
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ../runtime-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Rebuildable trusted-message relayer; keep persistent state across releases.
  relayer:
    build:
      context: ..
      dockerfile: deploy/relayer.Dockerfile
    image: ${RELAYER_IMAGE:-deploy-relayer}
    container_name: custos-bridge-relayer
    restart: unless-stopped
    environment:
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:?Relayer key must be configured}
      RELAYER_DEPLOYMENT_FILE: /app/contracts/launch-bridge/deployments/GIWA Sepolia--Ethereum Sepolia.json
      RELAYER_STATE_FILE: /data/bridge-relayer-state.json
      RELAYER_POLL_INTERVAL_MS: ${RELAYER_POLL_INTERVAL_MS:-5000}
      RELAYER_CONFIRMATIONS: ${RELAYER_CONFIRMATIONS:-1}
      RELAYER_RECEIPT_CONFIRMATIONS: ${RELAYER_RECEIPT_CONFIRMATIONS:-1}
      RELAYER_HTTP_HOST: 0.0.0.0
      RELAYER_HTTP_PORT: "8090"
    volumes:
      - ../runtime-data:/data
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NGINX_CONFIG: deploy/nginx.vm.conf
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_RELAYER_API_BASE: ${VITE_RELAYER_API_BASE:-/relayer}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-91342}
        VITE_NETWORK_URL: ${VITE_NETWORK_URL:-https://sepolia-rpc.giwa.io}
        VITE_GIWA_RPC: ${VITE_GIWA_RPC:-https://sepolia-rpc.giwa.io}
        VITE_GIWA_EXPLORER: ${VITE_GIWA_EXPLORER:-https://sepolia-explorer.giwa.io}
        VITE_GIWA_CHAIN_ID: ${VITE_GIWA_CHAIN_ID:-91342}
    container_name: custos-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      relayer:
        condition: service_healthy
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:8080"
      - "443:8443"
